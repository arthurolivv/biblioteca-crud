<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1 fw-bold">Biblioteca — Editar Usuario</span>
</nav>

<div class="container py-4">

    <form method="POST" enctype="multipart/form-data" th:action="@{/usuarios/editar(cpf=${usuario.cpf})}"
          th:object="${editarUsuarioDto}">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Editar Usuario</h3>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">👤 Informações do Usuário</h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome.pri_nome}"
                               placeholder="Ex: José" required>
                        <p th:if="${#fields.hasErrors('nome.pri_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.pri_nome}"></p>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Sobrenome</label>
                        <input type="text" class="form-control" th:field="*{nome.sob_nome}"
                               placeholder="Ex: Pereira da Silva" required>
                        <p th:if="${#fields.hasErrors('nome.sob_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.sob_nome}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">CPF</label>
                        <input readonly disabled type="text" class="form-control" th:value="${usuario.cpf}"
                               placeholder="000.000.000-00" required></div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">RG</label>
                        <input id="rg" type="text" class="form-control" th:field="*{rg}"
                               placeholder="00.000.000-0" required>
                        <p th:if="${#fields.hasErrors('rg')}" th:errorclass="text-danger" th:errors="*{rg}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" th:field="*{email}"
                               placeholder="Ex: seuemail@email.com" required>
                        <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger"
                           th:errors="*{email}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" class="form-control" th:field="*{data_nasc}" readonly required>
                        <p th:if="${#fields.hasErrors('data_nasc')}" th:errorclass="text-danger"
                           th:errors="*{data_nasc}"></p>
                    </div>

                </div>
            </div>
        </div>

        <!-- CARD 2: ENDEREÇO -->

        <!-- CARD 3: SENHA -->

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a class="btn btn-outline-danger" role="button" href="/usuarios">Cancelar</a>
            <button class="btn btn-dark" type="submit">Salvar</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
