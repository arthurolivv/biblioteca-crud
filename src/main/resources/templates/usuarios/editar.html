<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1 fw-bold">Biblioteca — Editar Usuario</span>
</nav>

<div class="container py-4">

    <form method="POST" enctype="multipart/form-data" th:action="@{/usuarios/editar(cpf=${usuario.cpf})}"
          th:object="${editarUsuarioDto}">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Editar Usuario</h3>

            <a class="btn btn-danger"
               role="button"
               onclick="return confirm('Tem certeza que deseja excluir este usuário?')"
               th:href="@{/usuarios/excluir(cpf=${usuario.cpf})}"
            >
                <i class="bi bi-trash3-fill"></i>
                Excluir Usuário
            </a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">👤 Informações do Usuário</h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome.pri_nome}"
                               placeholder="Ex: José" required>
                        <p th:if="${#fields.hasErrors('nome.pri_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.pri_nome}"></p>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Sobrenome</label>
                        <input type="text" class="form-control" th:field="*{nome.sob_nome}"
                               placeholder="Ex: Pereira da Silva" required>
                        <p th:if="${#fields.hasErrors('nome.sob_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.sob_nome}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">CPF</label>
                        <input readonly disabled type="text" class="form-control" th:value="${usuario.cpf}"
                               placeholder="000.000.000-00" required></div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">RG</label>
                        <input id="rg" type="text" class="form-control" th:field="*{rg}"
                               placeholder="00.000.000-0" required>
                        <p th:if="${#fields.hasErrors('rg')}" th:errorclass="text-danger" th:errors="*{rg}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="text" class="form-control" th:field="*{email}"
                               placeholder="Ex: seuemail@email.com" required>
                        <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger"
                           th:errors="*{email}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data de Nascimento</label>
                        <input class="form-control"
                               type="text"
                               th:value="${#temporals.format(editarUsuarioDto.data_nasc, 'dd/MM/yyyy')}"
                               readonly disabled required>
                        <p th:if="${#fields.hasErrors('data_nasc')}" th:errorclass="text-danger"
                           th:errors="${editarUsuarioDto.data_nasc}"></p>
                    </div>

                </div>
            </div>
        </div>

        <!-- CARD 2: ENDEREÇO -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">🏠 Endereço</h5>
            </div>

            <div class="card-body p-4">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">CEP</label>
                        <input id="cep" type="text" class="form-control" th:field="*{endereco.cep}"
                               placeholder="00000-000" required>
                        <p th:if="${#fields.hasErrors('endereco.cep')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.cep}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Cidade</label>
                        <input type="text" class="form-control" th:field="*{endereco.cidade}"
                               placeholder="Ex: São Paulo" required>
                        <p th:if="${#fields.hasErrors('endereco.cidade')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.cidade}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estado</label>
                        <input type="text" class="form-control" th:field="*{endereco.estado}"
                               placeholder="Ex: São Paulo" required>
                        <p th:if="${#fields.hasErrors('endereco.estado')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.estado}"></p>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Logradouro</label>
                        <input type="text" class="form-control" th:field="*{endereco.rua}"
                               placeholder="Ex: Alameda Santos" required>
                        <p th:if="${#fields.hasErrors('endereco.rua')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.rua}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Número</label>
                        <input type="text" class="form-control" th:field="*{endereco.numero}"
                               placeholder="Ex: 123" required>
                        <p th:if="${#fields.hasErrors('endereco.numero')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.numero}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Complemento</label>
                        <input type="text" class="form-control" th:field="*{endereco.complemento}"
                               placeholder="Ex: Ap 33 C" required>
                        <p th:if="${#fields.hasErrors('endereco.complemento')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.complemento}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Bairro</label>
                        <input type="text" class="form-control" th:field="*{endereco.bairro}"
                               placeholder="Ex: Ap 33 C" required>
                        <p th:if="${#fields.hasErrors('endereco.bairro')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.bairro}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">País</label>
                        <input type="text" class="form-control" th:field="*{endereco.pais}"
                               placeholder="Ex: Brasil" required>
                        <p th:if="${#fields.hasErrors('endereco.pais')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.pais}"></p>
                    </div>

                </div>
            </div>
        </div>

        <!-- CARD 3: SENHA -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">🏠 Endereço</h5>
            </div>

            <div class="card-body p-4">

                <div class="row g-3">
                    <!-- CARD: SENHA -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-semibold">🔒 Alterar Senha</h5>
                            <small class="text-muted">Deixe em branco para manter a senha atual</small>
                        </div>

                        <div class="card-body p-4">
                            <div class="row g-3">

                                <!-- Senha Atual -->
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Senha Atual</label>
                                    <input type="password" class="form-control" id="senhaAtual" name="senhaAtual"
                                           placeholder="Digite sua senha atual">
                                    <small class="text-muted">Necessário para alterar a senha</small>
                                </div>

                                <!-- Nova Senha -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nova Senha</label>
                                    <input type="password" class="form-control" id="senha" th:field="*{senha}"
                                           placeholder="Digite a nova senha" minlength="6">
                                    <small class="text-muted">Mínimo 6 caracteres</small>
                                </div>

                                <!-- Confirmar Senha -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Confirmar Senha</label>
                                    <input type="password" class="form-control" id="confirmarSenha"
                                           placeholder="Confirme a nova senha">
                                    <div id="senhaErro" class="text-danger mt-1" style="display: none;">
                                        As senhas não coincidem!
                                    </div>
                                    <div id="senhaOk" class="text-success mt-1" style="display: none;">
                                        ✓ Senhas coincidem
                                    </div>
                                </div>

                                <!-- Mensagem de erro do backend -->
                                <div th:if="${senhaErrada}" class="col-md-12">
                                    <div class="alert alert-danger" role="alert">
                                        ❌ Senha atual incorreta!
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a class="btn btn-outline-danger" role="button" href="/usuarios">Cancelar</a>
            <button class="btn btn-dark" type="submit">Salvar</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/usuarios/js/editar.js}"></script>
</body>
</html>
