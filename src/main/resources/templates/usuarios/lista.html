<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/livros/css/lista.css}">
</head>
<body class="bg-light">
<div class="container py-4">

    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="bi bi-book-half" style="font-size: 2rem"></i>
                <h3 class="fw-bold">Usuários</h3>
            </div>
            <p class="text-muted">Sistema de Gerenciamento de Biblioteca</p>
        </div>
        <a class="btn btn-dark" role="button" href="/usuarios/cadastro">+ Cadastrar Usuário</a>

    </header>

    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Total</h6>
                    <h3>2</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Ativos</h6>
                    <h3 class="text-success">1</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Manutenção</h6>
                    <h3 class="text-success">1</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Manutenção</h6>
                    <h3 class="text-success">1</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">

            <div class="card-header bg-white">
                <div class="d-flex align-items-center gap-2">
                    <h6 class="mb-0 d-flex align-items-center gap-2">
                        <i class="bi bi-funnel text-secondary"></i>
                        <span>Filtro de Usuarios</span>
                    </h6>
                </div>
            </div>

            <!-- Formulário de filtros dentro do mesmo card -->
            <form th:action="@{/templates/usuario}" method="get" id="formFiltros">
                <div class="card-body py-3">
                    <div class="row g-2 align-items-center">

                        <div class="col-md-4">
                            <div class="input-group">
                        <span class="input-group-text bg-light border-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                                <input type="text"
                                       class="form-control border-0 shadow-sm"
                                       placeholder="Pesquisar por ISBN, Título ou Autor...">
                            </div>
                        </div>

                        <div class="col-md-2">
                            <select class="form-select shadow-sm">
                                <option>Título A-Z</option>
                                <option>Título Z-A</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <select class="form-select shadow-sm">
                                <option value="" selected>Todas as Categorias</option>
                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nome}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <select class="form-select shadow-sm">
                                <option value="" selected>Todos os Status</option>
                                <option value="true">Ativo</option>
                                <option value="false">Inativo</option>
                            </select>
                        </div>

                        <div class="col-md-1 d-flex justify-content-center">
                            <button class="btn btn-danger w-100">
                                <i class="bi bi-trash3-fill"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </form>


            <div class="table-responsive desktop-table w-100">
                <table class="table table-striped align-middle mb-0 w-100">
                    <thead>
                    <tr>
                        <th>#CPF</th>
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>E-mail</th>
                        <th>Empréstimos Ativos</th>
                        <th>Reservas Ativas</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.cpf}" style="font-weight: bold">1212121</td>

                        <td th:text="${usuario.nome}"></td>

                        <td th:text="${usuario.sobrenome}"></td>

                        <td th:text="${usuario.email}"></td>

                        <td th:text="${usuario.emprestimos_atvs}"></td>

                        <td th:text="${usuario.reservas_atvs}"></td>

                        <td>
                            <span th:if="${!usuario.status}" class="badge bg-success">Ativo</span>
                            <span th:unless="${!usuario.status}" class="badge bg-danger">Inativo</span>
                        </td>

                        <td>
                            <div class="action-buttons">
                                <!--                                <a role="button" class="btn btn-sm btn-outline-secondary"-->
                                <!--                                   th:href="@{/usuario/visualizar(isbn=${usuario.isbn})}" title="Visualizar"><i-->
                                <!--                                        class="bi bi-eye"></i></a>-->
                                <a role="button" class="btn btn-sm btn-outline-primary"
                                   th:href="@{/usuarios/editar(cpf=${usuario.cpf})}"><i title="Editar"
                                                                                        class="bi bi-pencil"></i></a>

                                <a th:if="${!usuario.status}"
                                   role="button" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja desativar esse usuario?')"
                                   th:href="@{/usuarios/desativar(cpf=${usuario.cpf})}"
                                   title="Desativar"><i class="bi bi-trash"></i></a>

                                <a th:unless="${!usuario.status}"
                                   role="button" class="btn btn-sm btn-outline-success"
                                   onclick="return confirm('Tem certeza que deseja reativar esse usuario?')"
                                   th:href="@{/usuarios/ativar(cpf=${usuario.cpf})}"
                                   title="Reativar Usuario"><i class="bi bi-plus-circle"></i></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
