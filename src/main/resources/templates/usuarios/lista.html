<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .card {
            border: none;
        }

        .table th {
            font-weight: 600;
            color: #495057;
            background-color: #f8f9fa;
        }

        .desktop-table {
            overflow-x: auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">

    <!-- Cabeçalho -->
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="bi bi-people-fill" style="font-size: 2rem; color: #212529;"></i>
                <h3 class="fw-bold mb-0">Usuários</h3>
            </div>
            <p class="text-muted mb-0">Sistema de Gerenciamento de Biblioteca</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/">
                <i class="bi bi-house me-2"></i>Início
            </a>
            <a class="btn btn-dark" href="/usuarios/cadastro">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Usuário
            </a>
        </div>
    </header>

    <!-- Cards de Estatísticas -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Total de Usuários</h6>
                    <h2 class="mb-0 fw-bold" th:text="${usuarios.size()}">2</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Usuários Ativos</h6>
                    <h2 class="mb-0 fw-bold text-success" th:text="${ativos}"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Usuários Inativos</h6>
                    <h2 class="mb-0 fw-bold text-danger" th:text="${inativos}">1</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Card de Filtros e Tabela -->
    <div class="card shadow-sm">
        <!-- Cabeçalho de Filtros -->
        <div class="card-header bg-white border-bottom">
            <h6 class="mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-funnel text-secondary"></i>
                <span>Filtros de Pesquisa</span>
            </h6>
        </div>

        <!-- Formulário de Filtros -->
        <form th:action="@{/templates/usuario}" method="get" id="formFiltros">
            <div class="card-body">
                <div class="row g-3">
                    <!-- Busca -->
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Pesquisar</label>
                        <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                            <input type="text"
                                   class="form-control"
                                   name="busca"
                                   placeholder="Nome, CPF ou E-mail...">
                        </div>
                    </div>

                    <!-- Ordenação -->
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Ordenar por</label>
                        <select class="form-select" name="ordem">
                            <option value="nome_asc">Nome A-Z</option>
                            <option value="nome_desc">Nome Z-A</option>
                            <option value="cpf_asc">CPF Crescente</option>
                            <option value="cpf_desc">CPF Decrescente</option>
                        </select>
                    </div>

                    <!-- Categoria (mantido conforme original) -->
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Categoria</label>
                        <select class="form-select" name="categoria">
                            <option value="" selected>Todas as Categorias</option>
                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nome}">
                            </option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Status</label>
                        <select class="form-select" name="status">
                            <option value="" selected>Todos</option>
                            <option value="true">Ativo</option>
                            <option value="false">Inativo</option>
                        </select>
                    </div>

                    <!-- Botão Limpar -->
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="reset" class="btn btn-outline-danger w-100" title="Limpar filtros">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <!-- Tabela de Usuários -->
        <div class="desktop-table">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="text-center">CPF</th>
                    <th class="text-center">Nome</th>
                    <th class="text-center">Sobrenome</th>
                    <th class="text-center">E-mail</th>
                    <th class="text-center">Empréstimos Ativos</th>
                    <th class="text-center">Reservas</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td>
                        <strong th:text="${usuario.cpf}">000.000.000-00</strong>
                    </td>
                    <td th:text="${usuario.nome}" class="text-center">João</td>
                    <td th:text="${usuario.sobrenome}" class="text-center">Silva</td>
                    <td th:text="${usuario.email}" class="text-center">email@exemplo.com</td>
                    <td class="text-center">
                        <span class="badge bg-primary" th:text="${usuario.emprestimos_atvs}">0</span>
                    </td>
                    <td class="text-center">
                        <span class="badge bg-info" th:text="${usuario.reservas_atvs}">0</span>
                    </td>
                    <td class="text-center">
                        <span th:if="${!usuario.status}" class="badge bg-success">Ativo</span>
                        <span th:unless="${!usuario.status}" class="badge bg-danger">Inativo</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <!-- Botão Editar -->
                            <a role="button"
                               class="btn btn-sm btn-outline-secondary"
                               th:href="@{/usuarios/visualizar(cpf=${usuario.cpf})}"
                               title="Visualizar">
                                <i class="bi bi-eye"></i>
                            </a>

                            <a role="button"
                               class="btn btn-sm btn-outline-primary"
                               th:href="@{/usuarios/editar(cpf=${usuario.cpf})}"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <!-- Botão Desativar (se ativo) -->
                            <a th:if="${!usuario.status}"
                               role="button"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Tem certeza que deseja desativar este usuário?')"
                               th:href="@{/usuarios/desativar(cpf=${usuario.cpf})}"
                               title="Desativar">
                                <i class="bi bi-trash"></i>
                            </a>

                            <!-- Botão Reativar (se inativo) -->
                            <a th:unless="${!usuario.status}"
                               role="button"
                               class="btn btn-sm btn-outline-success"
                               onclick="return confirm('Tem certeza que deseja reativar este usuário?')"
                               th:href="@{/usuarios/ativar(cpf=${usuario.cpf})}"
                               title="Reativar">
                                <i class="bi bi-arrow-clockwise"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
