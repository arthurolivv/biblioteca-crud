<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://unpkg.com/imask"></script>

</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1 fw-bold">Biblioteca — Cadastro de Usuário</span>
</nav>

<div class="container py-4">

    <form method="POST" enctype="multipart/form-data" th:object="${cadastrarUsuarioDto}">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Cadastrar Novo Usuario</h3>
        </div>

        <!-- CARD 1: DADOS DO USUARIO -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">👤 Informações do Usuário</h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome.pri_nome}"
                               placeholder="Ex: José" required>
                        <p th:if="${#fields.hasErrors('nome.pri_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.pri_nome}"></p>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Sobrenome</label>
                        <input type="text" class="form-control" th:field="*{nome.sob_nome}"
                               placeholder="Ex: Pereira da Silva" required>
                        <p th:if="${#fields.hasErrors('nome.sob_nome')}" th:errorclass="text-danger"
                           th:errors="*{nome.sob_nome}"></p>

                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">CPF</label>
                        <input id="cpf" type="text" class="form-control" th:field="*{cpf}"
                               placeholder="000.000.000-00" required>
                        <p th:if="${#fields.hasErrors('cpf')}" th:errorclass="text-danger" th:errors="*{cpf}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">RG</label>
                        <input id="rg" type="text" class="form-control" th:field="*{rg}"
                               placeholder="00.000.000-0" required>
                        <p th:if="${#fields.hasErrors('rg')}" th:errorclass="text-danger" th:errors="*{rg}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="text" class="form-control" th:field="*{email}"
                               placeholder="Ex: Diário de um Banana" required>
                        <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger"
                           th:errors="*{email}"></p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" class="form-control" th:field="*{data_nasc}"
                               required>
                        <p th:if="${#fields.hasErrors('data_nasc')}" th:errorclass="text-danger"
                           th:errors="*{data_nasc}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARD 2: ENDEREÇO -->

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">🏠 Endereço</h5>
            </div>

            <div class="card-body p-4">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">CEP</label>
                        <input id="cep" type="text" class="form-control" th:field="*{endereco.cep}"
                               placeholder="00000-000" required>
                        <p th:if="${#fields.hasErrors('endereco.cep')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.cep}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Cidade</label>
                        <input type="text" class="form-control" th:field="*{endereco.cidade}"
                               placeholder="Ex: São Paulo" required>
                        <p th:if="${#fields.hasErrors('endereco.cidade')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.cidade}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estado</label>
                        <input type="text" class="form-control" th:field="*{endereco.estado}"
                               placeholder="Ex: São Paulo" required>
                        <p th:if="${#fields.hasErrors('endereco.estado')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.estado}"></p>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Logradouro</label>
                        <input type="text" class="form-control" th:field="*{endereco.rua}"
                               placeholder="Ex: Alameda Santos" required>
                        <p th:if="${#fields.hasErrors('endereco.rua')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.rua}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Número</label>
                        <input type="text" class="form-control" th:field="*{endereco.numero}"
                               placeholder="Ex: 123" required>
                        <p th:if="${#fields.hasErrors('endereco.numero')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.numero}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Complemento</label>
                        <input type="text" class="form-control" th:field="*{endereco.complemento}"
                               placeholder="Ex: Ap 33 C" required>
                        <p th:if="${#fields.hasErrors('endereco.complemento')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.complemento}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Bairro</label>
                        <input type="text" class="form-control" th:field="*{endereco.bairro}"
                               placeholder="Ex: Ap 33 C" required>
                        <p th:if="${#fields.hasErrors('endereco.bairro')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.bairro}"></p>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">País</label>
                        <input type="text" class="form-control" th:field="*{endereco.pais}"
                               placeholder="Ex: Brasil" required>
                        <p th:if="${#fields.hasErrors('endereco.pais')}"
                           th:errorclass="text-danger"
                           th:errors="*{endereco.pais}"></p>
                    </div>

                </div>
            </div>
        </div>

        <!-- CARD 2: SENHA -->

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">🔐 Senha</h5>
            </div>

            <div class="card-body p-4">

                <div class="row g-3">

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Senha</label>
                        <input type="password" class="form-control" th:field="*{senha}" required>
                        <p th:if="${#fields.hasErrors('senha')}"
                           th:errorclass="text-danger"
                           th:errors="*{senha}"></p>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Confirmar Senha</label>
                        <input type="password" class="form-control" required>
                        <!--                        <p th:if="${#fields.hasErrors('endereco.cidade')}"-->
                        <!--                           th:errorclass="text-danger"-->
                        <!--                           th:errors="*{endereco.cidade}"></p>-->
                    </div>

                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a class="btn btn-outline-danger" role="button" href="/usuarios">Cancelar</a>
            <button class="btn btn-dark" type="submit">Salvar</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/usuarios/js/cadastro.js}"></script>
</body>
</html>
