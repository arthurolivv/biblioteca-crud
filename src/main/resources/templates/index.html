<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Início - Biblioteca CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,.05);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card p-4">
        <h1 class="card-title text-center mb-4">Gerenciamento de Biblioteca</h1>

        <div class="d-grid gap-3 col-md-8 mx-auto">

            <a th:href="@{/livros}" class="btn btn-primary btn-lg">
                <i class="bi bi-book me-2"></i> Livros
            </a>

            <a th:href="@{/categoria}" class="btn btn-info btn-lg">
                <i class="bi bi-tags me-2"></i> Categorias
            </a>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
