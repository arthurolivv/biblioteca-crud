<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1 fw-bold">Biblioteca — Editar Livro</span>
</nav>

<div class="container py-4">

    <form method="POST" enctype="multipart/form-data" th:action="@{/livros/editar(isbn=${livro.isbn})}" th:object="${editarLivroDto}">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Editar Livro</h3>
        </div>

        <!-- CARD 1: DADOS DO LIVRO -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">📚 Informações do Livro</h5>
            </div>

            <div class="card-body p-4">
                <div class="row g-3">

                    <!-- ISBN -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">ISBN</label>
                        <input readonly disabled type="text" class="form-control" th:value="${livro.isbn}"
                               placeholder="ISBN-10 ou ISBN-13" required>
                    </div>

                    <!-- Título -->
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Título</label>
                        <input  type="text" class="form-control" th:field="*{titulo}"
                                placeholder="Ex: Diário de um Banana" required>
                        <p th:if="${#fields.hasErrors('titulo')}" th:errorclass="text-danger" th:errors="*{titulo}"></p>
                    </div>

                    <!-- Ano de publicação -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Ano de Publicação</label>
                        <input type="number" class="form-control" th:field="*{ano_publicacao}"
                               placeholder="Ex: 2009" required>
                        <p th:if="${#fields.hasErrors('ano_publicacao')}" th:errorclass="text-danger" th:errors="*{ano_publicacao}"></p>

                    </div>

                    <!-- Idioma -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Idioma</label>
                        <select class="form-select"
                                th:field="*{idioma}"
                                required>

                            <option value="" selected>Selecione...</option>

                            <option th:each="idioma : ${idiomas}"
                                    th:value="${idioma.name()}"
                                    th:text="${idioma}">
                            </option>

                        </select>
                        <p th:if="${#fields.hasErrors('idioma')}" th:errorclass="text-danger" th:errors="*{idioma}"></p>
                    </div>


                    <!-- Editora -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Editora</label>


                        <select class="form-select"
                                th:field="*{editora_cnpj}"
                                required>

                            <option value="" disabled selected>Selecione...</option>

                            <option th:each="editora : ${editoras}"
                                    th:value="${editora.cnpj}"
                                    th:text="${editora.razao_social}">
                            </option>
                        </select>

                        <p th:if="${#fields.hasErrors('editora_cnpj')}" th:errorclass="text-danger" th:errors="*{editora_cnpj}"></p>
                    </div>

                    <!-- Autores -->
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Autores</label>

                        <select id="autoresSelect" class="form-select" th:field="*{autor_oplid}" multiple required>
                            <option th:each="autor : ${autores}"
                                    th:value="${autor.oplid}"
                                    th:text="${autor.nome}">
                            </option>
                        </select>
                        <small class="text-muted">Segure Ctrl/Cmd para selecionar múltiplas categorias</small>
                        <p th:if="${#fields.hasErrors('autor_oplid')}" th:errorclass="text-danger" th:errors="*{autor_oplid}"></p>
                    </div>

                    <!-- Categorias -->
                    <div class="col-md-12 mt-3">
                        <label class="form-label fw-semibold">Categorias</label>

                        <select id="categoriasSelect" class="form-select" th:field="*{categoria_id}" multiple required>
                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nome}">
                            </option>
                        </select>
                        <p th:if="${#fields.hasErrors('categoria_id')}" th:errorclass="text-danger" th:errors="*{categoria_id}"></p>
                    </div>

                    <!-- Sinopse -->
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Sinopse</label>
                        <textarea class="form-control" th:field="*{sinopse}" rows="5"
                                  placeholder="Digite a sinopse do livro..." required>
                        </textarea>
                        <p th:if="${#fields.hasErrors('sinopse')}" th:errorclass="text-danger" th:errors="*{sinopse}"></p>
                    </div>

                    <!-- Imagem -->
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">URL da Imagem</label>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <input type="url"
                                       class="form-control"
                                       th:field="*{imagem_url}"
                                       th:classappend="${#fields.hasErrors('imagem_url')} ? 'is-invalid' : ''"
                                       placeholder="https://exemplo.com/capa-livro.jpg"
                                       id="imagemUrlInput"
                                       oninput="previewImagem()"
                                       required>
                                <small class="text-muted">Cole a URL da imagem da capa do livro</small>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('imagem_url')}" th:errors="*{imagem_url}"></div>
                            </div>
                            <div class="col-md-4">
                                <div class="card h-100">
                                    <div class="card-body d-flex align-items-center justify-content-center p-2"
                                         style="min-height: 150px; background: #f8f9fa;">
                                        <div id="imagemPreview" class="text-center">
                                            <svg width="80" height="80" fill="#dee2e6" viewBox="0 0 16 16">
                                                <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                                                <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                                            </svg>
                                            <p class="text-muted mb-0 mt-2" style="font-size: 0.85rem;">Preview da capa</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARD 2: EXEMPLARES -->

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">📦 Exemplares</h5>
            </div>

            <div class="card-body p-4">
                <!-- QUANTIDADE -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Adicionar Mais Exemplares</label>
                    <div class="input-group">
                        <input id="qtdExemplaresInput"
                               type="number"
                               min="1"
                               class="form-control"
                               placeholder="Quantidade a adicionar (ex: 3)">
                        <button type="button"
                                class="btn btn-outline-primary"
                                onclick="gerarExemplares()">
                            + Adicionar
                        </button>
                    </div>
                    <small class="text-muted">Digite quantos exemplares deseja adicionar e clique em "Adicionar"</small>
                    <p th:if="${#fields.hasErrors('exemplares')}" class="text-danger" th:errors="*{exemplares}"></p>
                </div>

                <!-- CONTAINER DOS EXEMPLARES -->
                <div id="exemplaresContainer"></div>
            </div>

            <!-- SCRIPT PARA CARREGAR EXEMPLARES -->
            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', function() {
                    /*[# th:if="${editarLivroDto != null and editarLivroDto.exemplares != null and !editarLivroDto.exemplares.isEmpty()}"]*/

                    const exemplares = [];

                    /*[# th:each="ex : ${editarLivroDto.exemplares}"]*/
                    exemplares.push({
                        codigo_exemplar: /*[[${ex.codigo_exemplar}]]*/ '',
                        proprio: /*[[${ex.proprio}]]*/ false,
                        status: /*[[${ex.status != null ? ex.status.name() : ''}]]*/ ''
                    });
                    /*[/]*/

                    if (exemplares.length > 0) {
                        console.log('Carregando exemplares existentes:', exemplares);
                        carregarExemplaresExistentes(exemplares);
                    }

                    /*[/]*/
                });
            </script>

        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a class="btn btn-outline-danger" role="button" href="/livros">Cancelar</a>
            <button class="btn btn-dark" type="submit">Salvar</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/livros/js/editar.js}"></script>
</body>
</html>
