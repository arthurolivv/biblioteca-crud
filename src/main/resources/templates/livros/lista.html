<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livros - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/livros/css/lista.css}">
</head>
<body class="bg-light">
<div class="container-fluid py-4">

    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="bi bi-book-half" style="font-size: 2rem; color: #212529;"></i>
                <h3 class="fw-bold mb-0">Livros</h3>
            </div>
            <p class="text-muted mb-0">Sistema de Gerenciamento de Biblioteca</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/">
                <i class="bi bi-house me-2"></i>Início
            </a>
            <a class="btn btn-dark" href="/livros/cadastro">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Livro
            </a>
        </div>
    </header>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Total de Livros</h6>
                    <h2 class="mb-0 fw-bold" th:text="${livros.size()}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Livros Ativos</h6>
                    <h2 class="mb-0 fw-bold text-success">1</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Em Manutenção</h6>
                    <h2 class="mb-0 fw-bold text-warning">1</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Disponíveis</h6>
                    <h2 class="mb-0 fw-bold text-info">0</h2>
                </div>
            </div>
        </div>
    </div>


    <div class="card shadow-sm">
        <div class="card-header bg-white border-bottom">
            <h6 class="mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-funnel text-secondary"></i>
                <span>Filtros de Pesquisa</span>
            </h6>
        </div>

        <form th:action="@{/livros}" method="get" id="formFiltros">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label small text-muted">Pesquisar</label>
                        <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                            <input type="text"
                                   class="form-control"
                                   name="busca"
                                   placeholder="ISBN, Título ou Autor..."
                                   th:value="${buscaSelecionada}">
                        </div>
                    </div>

<!--                    <div class="col-md-3">-->
<!--                        <label class="form-label small text-muted">Autor</label>-->
<!--                        <select class="form-select" name="autorId">-->
<!--                            <option value="" th:selected="${autorSelecionado == ''}">Todos os Autores</option>-->
<!--                            <option th:each="autor : ${autores}"-->
<!--                                    th:value="${autor.oplid}"-->
<!--                                    th:text="${autor.nome}"-->
<!--                                    th:selected="${autorSelecionado == autor.oplid}">-->
<!--                            </option>-->
<!--                        </select>-->
<!--                    </div>-->

                    <div class="col-md-3">
                        <label class="form-label small text-muted">Categoria</label>
                        <select class="form-select" name="categoriaId">
                            <option value="" th:selected="${categoriaSelecionada == null or categoriaSelecionada == ''}">Todas as Categorias</option>
                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nome}"
                                    th:selected="${categoriaSelecionada != null and categoriaSelecionada == #strings.toString(categoria.id)}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100" title="Pesquisar">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small text-muted">Status</label>
                        <select class="form-select" name="status">
                            <option value="" th:selected="${statusSelecionado == null or statusSelecionado == ''}">Todos</option>
                            <option value="true" th:selected="${statusSelecionado == 'true'}">Ativo</option>
                            <option value="false" th:selected="${statusSelecionado == 'false'}">Inativo</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small text-muted">Idioma</label>
                        <select class="form-select" name="idioma">
                            <option value="" th:selected="${idiomaSelecionado == ''}">Todos os Idiomas</option>
                            <option th:each="idiomaEnum : ${idiomas}"
                                    th:value="${idiomaEnum.name()}"
                                    th:text="${idiomaEnum.name()}"
                                    th:selected="${idiomaSelecionado == idiomaEnum.name()}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-muted">Ordenar por</label>
                        <select class="form-select" name="ordem">
                            <option value="titulo_asc" th:selected="${ordemSelecionada == 'titulo_asc'}">Título A-Z</option>
                            <option value="titulo_desc" th:selected="${ordemSelecionada == 'titulo_desc'}">Título Z-A</option>
                            <option value="ano_desc" th:selected="${ordemSelecionada == 'ano_desc'}">Ano (Mais recente)</option>
                            <option value="ano_asc" th:selected="${ordemSelecionada == 'ano_asc'}">Ano (Mais antigo)</option>
                            <option value="disponiveis_desc" th:selected="${ordemSelecionada == 'disponiveis_desc'}">Disponíveis (Maior)</option>
                            <option value="disponiveis_asc" th:selected="${ordemSelecionada == 'disponiveis_asc'}">Disponíveis (Menor)</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-flex align-items-end">
                        <a th:href="@{/livros}" class="btn btn-outline-danger w-100" title="Limpar filtros">
                            <i class="bi bi-x-circle"></i>
                        </a>
                    </div>
                </div>
            </div>
        </form>

        <div class="desktop-table">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Capa</th>
                    <th>Título</th>
                    <th>Autor(es)</th>
                    <th>Categoria(s)</th>
                    <th>Idioma</th>
                    <th class="text-center">Ano</th>
                    <th class="text-center">Qtd.</th>
                    <th class="text-center">Disp.</th>
                    <th class="text-center">Status</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="livro : ${livros}">
                    <td>
                        <strong th:text="${livro.isbn}">1212121</strong>
                    </td>

                    <td>
                        <img th:if="${livro.imagem_url != null}"
                             th:src="${livro.imagem_url}"
                             alt="Capa do livro"
                             class="book-cover">
                        <i th:unless="${livro.imagem_url != null}"
                           class="bi bi-book-half icon-cover"></i>
                    </td>

                    <td>
                        <span th:text="${livro.titulo}" class="fw-semibold">Título</span>
                    </td>

                    <td>
                                <span th:each="autorRel, iterStat : ${livro.autorEscreveLivro}">
                                <a th:href="@{/autores/{oplid}(oplid=${autorRel.autor.oplid})}"
                                   th:text="${autorRel.autor.nome}"
                                   class="text-primary text-decoration-none"></a>
                                    <span th:if="${!iterStat.last}">, </span>
                                </span>
                    </td>

                    <td>
                        <div class="book-categories">
                                    <span class="badge bg-dark"
                                          th:each="categoriaRel : ${livro.livroPertenceCategoria}"
                                          th:text="${categoriaRel.categoria.nome}">Categoria</span>
                        </div>
                    </td>

                    <td th:text="${livro.idioma.name}">PT-BR</td>

                    <td class="text-center" th:text="${livro.ano_publicacao}">2025</td>

                    <td class="text-center">
                        <span class="badge bg-secondary" th:text="${livro.quantidade}">5</span>
                    </td>

                    <td class="text-center">
                        <span class="badge bg-success" th:text="${livro.disponiveis}">5</span>
                    </td>

                    <td class="text-center">
                        <span th:if="${!livro.deleted}" class="badge bg-success">Ativo</span>
                        <span th:unless="${!livro.deleted}" class="badge bg-danger">Inativo</span>
                    </td>

                    <td>
                        <div class="action-buttons">
                            <a role="button"
                               class="btn btn-sm btn-outline-secondary"
                               th:href="@{/livros/visualizar(isbn=${livro.isbn})}"
                               title="Visualizar">
                                <i class="bi bi-eye"></i>
                            </a>

                            <a role="button"
                               class="btn btn-sm btn-outline-primary"
                               th:href="@{/livros/editar(isbn=${livro.isbn})}"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <a th:if="${!livro.deleted}"
                               role="button"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Tem certeza que deseja desativar este livro?')"
                               th:href="@{/livros/desativar(isbn=${livro.isbn})}"
                               title="Desativar">
                                <i class="bi bi-trash"></i>
                            </a>

                            <a th:unless="${!livro.deleted}"
                               role="button"
                               class="btn btn-sm btn-outline-success"
                               onclick="return confirm('Tem certeza que deseja reativar este livro?')"
                               th:href="@{/livros/ativar(isbn=${livro.isbn})}"
                               title="Reativar">
                                <i class="bi bi-arrow-clockwise"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
