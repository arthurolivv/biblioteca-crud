<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/categoria/css/lista.css}">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Gerenciamento de Categorias</h1>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-start mb-3">
        <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#modalCadastro">
            Adicionar Nova Categoria
        </button>
        <a href="/" class="btn btn-secondary">Voltar para o Início</a>
    </div>


    <div th:if="${categorias.isEmpty()}" class="alert alert-info">
        Nenhuma categoria encontrada.
    </div>
    <table th:unless="${categorias.isEmpty()}" class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}">1</td>
            <td th:text="${categoria.nome}">Ficção Científica</td>
            <td>
                <form th:action="@{/categoria/{id}/excluir(id=${categoria.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Tem certeza que deseja excluir a categoria: ' + '[[${categoria.nome}]]' + '? Esta ação não pode ser desfeita.')">
                        Deletar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="modalCadastro" tabindex="-1" aria-labelledby="modalCadastroLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/categoria}" method="post" th:object="${cadastrarCategoriaDto}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCadastroLabel">Cadastrar Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nomeCategoria" class="form-label">Nome da Categoria:</label>
                        <input type="text"
                               class="form-control"
                               id="nomeCategoria"
                               th:field="*{nome}"
                               placeholder="Ex: Ficção Científica"
                               required
                               maxlength="100"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                        <div th:if="${#fields.hasErrors('nome')}" class="invalid-feedback">
                            <span th:errors="*{nome}">Erro de nome</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/categoria/js/categoria.js}"></script>
</body>
</html>
