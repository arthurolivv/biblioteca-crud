<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/categoria/lista.css}">

</head>
<body class="bg-light">
<div class="container py-4">

    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="bi bi-tags-fill" style="font-size: 2rem; color: #212529;"></i>
                <h3 class="fw-bold mb-0">Categorias</h3>
            </div>
            <p class="text-muted mb-0">Sistema de Gerenciamento de Biblioteca</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/">
                <i class="bi bi-house me-2"></i>Início
            </a>
            <button type="button"
                    class="btn btn-dark"
                    data-bs-toggle="modal"
                    data-bs-target="#modalCadastro">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Categoria
            </button>
        </div>
    </header>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Total de Categorias</h6>
                    <h2 class="mb-0 fw-bold" th:text="${categorias.size()}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Categorias Ativas</h6>
                    <h2 class="mb-0 fw-bold text-success" th:text="${categorias.size()}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-2">Livros Cadastrados</h6>
                    <h2 class="mb-0 fw-bold text-primary" th:text="${totalLivrosCadastrados}">-</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white border-bottom">
            <h6 class="mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-funnel text-secondary"></i>
                <span>Filtros de Pesquisa</span>
            </h6>
        </div>

        <form th:action="@{/categoria}" method="get" id="formFiltros">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label small text-muted">Pesquisar</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text"
                                   class="form-control"
                                   name="busca"
                                   placeholder="Nome da categoria...">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-muted">Ordenar por</label>
                        <select class="form-select" name="ordem">
                            <option value="id_asc">ID Crescente</option>
                            <option value="id_desc">ID Decrescente</option>
                            <option value="nome_asc">Nome A-Z</option>
                            <option value="nome_desc">Nome Z-A</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-flex align-items-end">
                        <button type="reset" class="btn btn-outline-danger w-100" title="Limpar filtros">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <div class="desktop-table">
            <div th:if="${categorias.isEmpty()}" class="alert alert-info m-3">
                <i class="bi bi-info-circle me-2"></i>
                Nenhuma categoria encontrada.
            </div>

            <table th:unless="${categorias.isEmpty()}" class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="text-center">ID</th>
                    <th>Nome</th>
                    <th class="text-center">Livros</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td class="text-center">
                        <strong th:text="${categoria.id}">1</strong>
                    </td>
                    <td>
                        <span class="fw-semibold" th:text="${categoria.nome}">Nome da Categoria</span>
                    </td>
                    <td class="text-center">
                        <span class="badge bg-primary" th:text="${categoria.totalLivros}">0</span>
                    </td>
                    <td>
                        <div class="action-buttons justify-content-center">
                            <form th:action="@{/categoria/{id}/excluir(id=${categoria.id})}"
                                  method="post"
                                  style="display: inline;"
                                  th:attr="onsubmit='return confirm(\'Tem certeza que deseja excluir a categoria: ' + ${categoria.nome} + '? Esta ação não pode ser desfeita.\')'">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger"
                                        title="Deletar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="modal fade" id="modalCadastro" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/categoria}" method="post" th:object="${cadastrarCategoriaDto}">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle text-primary me-2"></i>
                        Cadastrar Nova Categoria
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nomeCategoria" class="form-label fw-semibold">
                            <i class="bi bi-tag me-1"></i>
                            Nome da Categoria
                        </label>
                        <input type="text"
                               class="form-control"
                               id="nomeCategoria"
                               th:field="*{nome}"
                               placeholder="Ex: Ficção Científica, Romance, Terror..."
                               required
                               maxlength="100"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                        <div th:if="${#fields.hasErrors('nome')}" class="invalid-feedback">
                            <span th:errors="*{nome}">Erro de nome</span>
                        </div>
                        <div class="form-text">
                            <i class="bi bi-info-circle me-1"></i>
                            Máximo de 100 caracteres
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Fechar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        Cadastrar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/categoria/js/categoria.js}"></script>
</body>
</html>
