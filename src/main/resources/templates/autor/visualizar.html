<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
<div class="container py-4">

    <!-- Cabeçalho (Adicionado botão Voltar) -->
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold" th:text="${autor.nome}">Nome do Autor</h2>
            <p class="text-muted mb-0">
                Nacionalidade:
                <span th:text="${autor.nacionalidadeFormatada}">BR</span>
            </p>
        </div>
        <!-- Botão Voltar Adicionado -->
        <a class="btn btn-dark" role="button" href="/autores">
            <i class="bi bi-arrow-left me-2"></i>Voltar
        </a>
    </header>

    <!-- Livros -->
    <div class="card shadow-sm">
        <div class="card-header bg-white border-bottom">
            <h5 class="mb-0">Livros escritos</h5>
        </div>

        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Capa</th>
                    <th>Título</th>
                    <th>ISBN</th>
                    <th>Idioma</th>
                    <th>Ano</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rel : ${livros}">
                    <td>
                        <img th:if="${rel.livro.imagem_url != null}"
                             th:src="${rel.livro.imagem_url}"
                             class="rounded"
                             style="width:50px; height:70px; object-fit:cover;">
                        <i th:unless="${rel.livro.imagem_url != null}"
                           class="bi bi-book-half fs-2 text-secondary"></i>
                    </td>

                    <td th:text="${rel.livro.titulo}">Título</td>

                    <td th:text="${rel.livro.isbn}">ISBN</td>

                    <td th:text="${rel.livro.idioma}">Idioma</td>

                    <td th:text="${rel.livro.ano_publicacao}">Ano</td>

                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/livros/visualizar(isbn=${rel.livro.isbn})}">
                            Ver Livro
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
