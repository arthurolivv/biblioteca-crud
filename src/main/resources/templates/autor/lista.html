<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Autores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Gerenciamento de Autores</h1>

    <div class="d-flex justify-content-start mb-3">
        <a href="/" class="btn btn-secondary me-2">Voltar para o Início</a>
        <a href="/autores/cadastro" class="btn btn-primary">Adicionar Novo Autor</a>
    </div>

    <div th:if="${autores.isEmpty()}" class="alert alert-info">
        Nenhum autor encontrado.
    </div>

    <table th:unless="${autores.isEmpty()}" class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Nacionalidade</th>
            <th>Livros Escritos</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="autor : ${autores}">
            <td th:text="${autor.oplid}">1</td>
            <td>
                <a th:href="@{/autores/{oplid}(oplid=${autor.oplid})}"
                   th:text="${autor.nome}">Nome do Autor</a>
            </td>
            <td th:text="${autor.nacionalidadeFormatada}">BR</td>
            <td th:text="${autor.escreve != null ? autor.escreve.size() : 0}">0</td>
            <td>
                <a th:href="@{/autores/{oplid}(oplid=${autor.oplid})}"
                   class="btn btn-sm btn-outline-secondary">Visualizar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
